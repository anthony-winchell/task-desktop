<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Task Tracker</title>
  </head>
  <body>
    <main id="app">
      <h1>Task Tracker</h1>
      <p id="description">The cloud is just someone else's computer</p>

      <ul id="task-list"></ul>

      <form id="task-form">
        <input id="task-title" type="text" placeholder="What now?" required />
        <button type="submit">Add task</button>
      </form>

      <p id="status">Loading tasks...</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
